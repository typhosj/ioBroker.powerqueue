<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="PowerQueue">
    <title>PowerQueue</title>
    <!--
        Concept G "energy streams", refined for the adapter icon: one finite energy source at the
        top separates into three descending allocation streams, each one shorter than the one above
        it. Flat colours, no gradients, no lettering, transparent gaps — so the silhouette survives
        32 px and works on a light as well as on a dark background.
    -->
    <path fill="#F7B00F" d="M256 40 C316 120 360 190 360 246 A104 104 0 1 1 152 246 C152 190 196 120 256 40 Z" />
    <g fill="none" stroke-linecap="round">
        <path stroke="#2E9D95" stroke-width="46" d="M118 384 Q256 330 394 384" />
        <path stroke="#1D6A8C" stroke-width="42" d="M158 436 Q256 392 354 436" />
        <path stroke="#143A6B" stroke-width="38" d="M206 482 Q256 450 306 482" />
    </g>
</svg>
